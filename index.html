<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#166b59" />
    <meta name="description" content="KruNote ผู้ช่วยครูสำหรับเช็กชื่อ ตรวจงาน บันทึกคะแนน ตัดเกรด และสร้างรายงาน" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>KruNote — ผู้ช่วยครูส่วนตัว</title>
    <script>
      (() => {
        const preference = localStorage.getItem('krunote.theme') || 'system'
        const resolved = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = resolved
        document.documentElement.lang = localStorage.getItem('krunote.locale') || 'th'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>กรุณาเปิด JavaScript เพื่อใช้งาน KruNote</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
